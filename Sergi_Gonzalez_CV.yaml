cv:
  name: Sergi Gonzalez
  headline: Senior Software Engineer · Team Lead
  location: Barcelona, Spain
  email: sergigp85@gmail.com
  social_networks:
    - network: LinkedIn
      username: sergigp
    - network: GitHub
      username: sergigp
  sections:
    summary:
      - Product-minded engineer and team lead with 15+ years building software for startups and scale-ups, remote since 2018. Believes that software architecture and tools depend on context and product strategy. Grew two teams from scratch, built a chat platform serving 130K+ concurrent users at Letgo, co-founded a startup, and led an international team at Coralogix. Works spec-first with AI coding agents. Looking for remote senior backend or team lead roles from January 2027.
    skills:
      - label: Languages
        details: Rust, Scala, TypeScript
      - label: Backend & Architecture
        details: Distributed systems, event-driven architecture, microservices, DDD/CQRS, Kafka, gRPC
      - label: Infrastructure & Observability
        details: Kubernetes, AWS, Terraform, Prometheus, Grafana
      - label: Data
        details: MySQL, PostgreSQL, Elasticsearch, DynamoDB
      - label: AI-assisted development
        details: Claude Code, Codex, spec-driven development
      - label: Frontend (working knowledge)
        details: Angular, React
    experience:
      - company: Career break
        position: Sabbatical and personal projects
        start_date: 2026-01
        end_date: present
        highlights:
          - Planned break after Coralogix, including parental leave.
          - Built [Yarrtube](https://github.com/sergigp/yarrtube), an open-source self-hosted YouTube synchronizer (Rust, React, TypeScript), spec-first with Claude Code and OpenSpec. 140+ GitHub stars.
          - Currently building [Superthree](https://github.com/sergigp/superthree), a self-hosted TV channel for kids where parents schedule what plays (TypeScript).
      - company: Coralogix
        position: Software Engineer, Data Usage Team
        start_date: 2025-05
        end_date: 2025-12
        location: Remote
        summary: B2B observability SaaS that grew from about 100 to 500+ employees between 2022 and 2025. Moved to the team that meters each customer's platform usage and enforces quotas.
        highlights:
          - Helped replace the legacy JavaScript quota blocker with a new Rust service that warns customers approaching their quota and blocks ingestion within minutes of them exceeding it.
          - Added per-data-type blocking rules (logs, metrics, traces) and quota sharing between data types.
          - Built customer-facing usage dashboards on usage data aggregated from Kafka into ClickHouse.
      - company: Coralogix
        position: Team Lead, Dashboards Team
        start_date: 2022-04
        end_date: 2025-05
        location: Remote
        summary: Promoted shortly after joining the company to found and lead the dashboards team, acting as its engineering manager.
        highlights:
          - Built custom dashboards, a Grafana-like product that became the platform's native alternative to Grafana for customers and replaced it company-wide for internal service monitoring.
          - Grew the team from 1 to 6 engineers, mostly frontend (Angular), owning hiring and performance management.
          - Delivered the home dashboard and took over Explore, the product's highest-traffic page (log exploration).
          - First frontend team at the company to adopt end-to-end testing (Playwright); other teams followed.
          - Main contributor to the team's backend (Scala) and infrastructure (Kubernetes), hands-on in the Angular frontend.
      - company: Cassette
        position: Co-Founder
        start_date: 2020-11
        end_date: 2022-01
        location: Remote
        summary: Bootstrapped startup founded with three former Letgo colleagues. Desktop and mobile app for asynchronous meetings over voice notes, aimed at replacing daily stand-ups.
        highlights:
          - Built the backend (Scala) and the desktop app (Electron, TypeScript), and ran the AWS infrastructure, including voice-note transcription with Amazon Transcribe.
          - Reached about 100 sign-ups and 5 teams running daily stand-ups on it, steered by regular user interviews.
          - Pitched investors and wound the company down after 14 months without funding or product-market fit.
      - company: Letgo
        position: Staff Engineer, Platform Team
        start_date: 2018-08
        end_date: 2020-10
        location: Remote
        summary: B2C second-hand marketplace for the US market that raised about $1 billion and grew to 300+ employees. Proposed the platform backend team to the CTO and moved into it, as one of three engineers.
        highlights:
          - Built the PHP and Scala libraries that every backend team used to publish and consume domain events, standardizing how 40 engineers integrated their services.
          - Introduced service quality tracking across backend teams, covering SLAs, downtime and test coverage.
          - Built a company-wide domain event explorer, used by backend teams for debugging and by customer care.
          - Moved the company's event backbone from SNS and SQS to Kafka.
          - Ran backend recruiting with the platform team, hiring 20+ engineers across both Letgo roles.
      - company: Letgo
        position: Team Lead, Chat Team
        start_date: 2015-10
        end_date: 2018-08
        location: Barcelona
        highlights:
          - Built the new real-time chat in Scala and Akka (WebSockets, MariaDB), which peaked at 130K+ concurrent users and handled over 4 billion messages.
          - Migrated from the PHP chat with zero downtime, running both in parallel for months and keeping them in sync through domain events over SQS.
          - Scaled it with Akka Cluster and archived older messages to DynamoDB as volume grew.
          - Led the company-wide move to an event-driven microservices architecture. Every backend team adopted domain events (SNS, SQS) and owned its own database, built from projections.
          - Grew the team from 1 to a cross-functional squad of 8 and began co-leading hiring for the backend department.
      - company: Akamon (2014–15), Atrápalo (2011–14) and others
        position: Earlier roles – Software Engineer
        date: 2010 – 2015
    talks:
      - bullet: Microservices Anti-Patterns, Bilbostack 2020 ([slides, ES](https://es.slideshare.net/sergigp/otra-charla-de-microservicicios-bilbostack2020))
      - bullet: From Polling to Real Time, BCN Software Crafters 2017 ([slides, EN](https://es.slideshare.net/sergigp/from-polling-to-real-time-scala-akka-and-websockets-from-scratch-66626441))
      - bullet: DDD as an Implementation Detail, PHP Barcelona 2015 ([slides, EN](https://es.slideshare.net/sergigp/php-barcelona-monthly-talk-feb-2015))
    education:
      - institution: Universitat Autònoma de Barcelona (UAB)
        area: Computer Science
        degree: BSc
        end_date: 2010
    languages:
      - Catalan and Spanish (native), English (fluent; led an international team in English, 2022–2025)

design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 1.6cm
    bottom_margin: 1.5cm
    left_margin: 1.9cm
    right_margin: 1.9cm
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(30, 30, 30)
    name: rgb(0, 0, 0)
    headline: rgb(70, 70, 70)
    connections: rgb(70, 70, 70)
    section_titles: rgb(13, 148, 25)
    links: rgb(30, 30, 30)
  typography:
    line_spacing: 0.7em
    alignment: left
    font_family:
      body: Source Sans 3
      name: Source Sans 3
      headline: Source Sans 3
      connections: Source Sans 3
      section_titles: Source Sans 3
    font_size:
      body: 10pt
      name: 28pt
      headline: 12pt
      connections: 10pt
      section_titles: 1.45em
    bold:
      name: false
      section_titles: true
  links:
    underline: true
  header:
    alignment: center
    space_below_name: 0.35cm
    space_below_headline: 0.3cm
    space_below_connections: 0.4cm
    connections:
      show_icons: false
      display_urls_instead_of_usernames: true
      separator: "·"
  section_titles:
    type: with_full_line
    line_thickness: 0.6pt
    space_above: 0.7cm
    space_below: 0.3cm
  sections:
    space_between_regular_entries: 0.6cm
    space_between_text_based_entries: 0.14cm
    show_time_spans_in: []
  entries:
    summary:
      space_above: 0.12cm
    highlights:
      bullet: "●"
      space_left: 0.4cm
      space_above: 0.14cm
      space_between_items: 0.1cm
      space_between_bullet_and_text: 0.6em
  templates:
    experience_entry:
      main_column: "**POSITION**\nCOMPANY -- LOCATION\n*SUMMARY*\nHIGHLIGHTS"
      date_and_location_column: "**DATE**"

locale:
  language: english

settings:
  render_command:
    dont_generate_html: true
    dont_generate_png: true
