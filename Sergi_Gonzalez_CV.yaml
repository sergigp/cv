design:
  theme: engineeringresumes
  page:
    size: a4
    top_margin: 1.5cm
    bottom_margin: 1.5cm
    left_margin: 1.5cm
    right_margin: 1.5cm
    show_footer: true
    show_top_note: false
  typography:
    font_size:
      body: 10pt
      name: 26pt
    alignment: left
  header:
    alignment: center
    connections:
      show_icons: true
      display_urls_instead_of_usernames: true
  sections:
    show_time_spans_in:
      - experience

locale:
  language: english

settings:
  current_date: today
  render_command:
    output_folder: rendercv_output
    dont_generate_markdown: false
    dont_generate_html: true
    dont_generate_typst: false
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords: []
  pdf_title: NAME - CV
